name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check.test.mjs
      - run: node scripts/check.mjs --against socialcrawl/skills socialcrawl/mcp
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Plugin manifests parse
        run: for f in .claude-plugin/*.json .cursor-plugin/*.json .codex-plugin/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: The skills installer finds every skill
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          out=$(npx -y skills add . --list 2>&1 | sed -E 's/\x1b\[[0-9;?]*[a-zA-Z]//g')
          echo "$out"
          if echo "$out" | grep -q "SKIPPED"; then echo "The installer skipped a skill."; exit 1; fi
          n=$(ls -d skills/*/ | wc -l)
          echo "$out" | grep -q "Found $n skills" || { echo "The installer did not find all $n skills."; exit 1; }
